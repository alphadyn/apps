name: Build and Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - .github/workflows/deploy-pages.yml
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Test and build Market Insights snapshot
        run: |
          python3 -m pip install --disable-pip-version-check -r market-insights/requirements-build.txt
          python3 -m unittest discover -s fund-map -p 'test_*.py'
          python3 -m unittest discover -s market-map -p 'test_*.py'
          python3 market-insights/build_data.py
          python3 fund-map/build_assets.py
          python3 fund-map/build_holdings.py

      - name: Test and build Signal news snapshot
        run: python3 signal/build_data.py

      - name: Build Pulse post previews
        run: |
          python3 -m pip install --disable-pip-version-check -r pulse/requirements-build.txt
          python3 pulse/build_share_pages.py

      - name: Build Experiences previews
        run: python3 experiences/build_share_pages.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5