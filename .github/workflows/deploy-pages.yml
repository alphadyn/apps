name: Build and Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - .github/workflows/deploy-pages.yml
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build S&P 500 market snapshot
        run: python3 market-lens/build_data.py

      - name: Test and build S&P 500 Ranker snapshot
        run: |
          python3 -m pip install --disable-pip-version-check -r sp500-ranker/requirements-build.txt
          python3 -m unittest discover -s sp500-ranker -p test_build_data.py
          node --test sp500-ranker/ranking.test.js sp500-ranker/history.test.js
          python3 sp500-ranker/build_data.py

      - name: Test and build Signal news snapshot
        run: |
          python3 -m unittest discover -s signal -p test_build_data.py
          node --test signal/app.test.js
          python3 signal/build_data.py

      - name: Test Playlist logic
        run: node --test player/playlist.test.js

      - name: Build Pulse post previews
        run: |
          python3 -m pip install --disable-pip-version-check -r pulse/requirements-build.txt
          python3 pulse/build_share_pages.py

      - name: Build Experiences previews
        run: python3 experiences/build_share_pages.py

      - name: Build Market Curve Lab security previews
        run: python3 market-curve-lab/build_share_pages.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5