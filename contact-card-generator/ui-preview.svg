      <rect width="76" height="76" rx="10" fill="white"/>
      <rect x="9" y="9" width="22" height="22" rx="3" fill="#315EE8"/>
      <rect x="13" y="13" width="14" height="14" rx="1" fill="white"/>
      <rect x="17" y="17" width="6" height="6" fill="#315EE8"/>
      <rect x="45" y="9" width="22" height="22" rx="3" fill="#315EE8"/>
      <rect x="49" y="13" width="14" height="14" rx="1" fill="white"/>
      <rect x="53" y="17" width="6" height="6" fill="#315EE8"/>
      <rect x="9" y="45" width="22" height="22" rx="3" fill="#315EE8"/>
      <rect x="13" y="49" width="14" height="14" rx="1" fill="white"/>
      <rect x="17" y="53" width="6" height="6" fill="#315EE8"/>
      <rect x="45" y="45" width="8" height="8" rx="1" fill="#8BA8F4"/>
      <rect x="58" y="45" width="9" height="8" rx="1" fill="#8BA8F4"/>
      <rect x="45" y="58" width="8" height="9" rx="1" fill="#8BA8F4"/>
      <rect x="58" y="58" width="9" height="9" rx="1" fill="#8BA8F4"/>
    </g>
    <text x="662" y="447" fill="#C1D4FA" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2">READY TO CONNECT</text>
  </g>
