<!DOCTYPE html>
<html lang="en">
<head>
  <script defer src="/apps/analytics.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Fractal Atlas: 10 Classic Patterns</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell" id="app-shell">
    <aside class="panel">
      <header class="panel-header">
        <span class="eyebrow">Interactive fractal studio</span>
        <h1>Fractal Atlas</h1>
        <p class="subtitle">Explore the beauty of infinite patterns.</p>
      </header>

      <section class="control-section" aria-labelledby="pattern-heading">
        <h2 class="section-title" id="pattern-heading">Pattern</h2>
        <label for="fractal-select">Choose a fractal</label>
        <select id="fractal-select" aria-label="Select fractal pattern"></select>

        <div class="controls-row">
          <label for="detail">Detail</label>
          <span id="detail-value">6</span>
          <input id="detail" type="range" min="1" max="10" value="6" />
        </div>

        <p id="pattern-description" class="description"></p>
      </section>

      <section class="control-section" aria-labelledby="generate-heading">
        <h2 class="section-title" id="generate-heading">Generate</h2>
        <div class="button-row action-row">
          <button id="render-btn" class="btn-primary">Render</button>
          <button id="random-btn" class="btn-secondary">Random Pick</button>
        </div>
      </section>

      <section class="control-section" aria-labelledby="view-heading">
        <h2 class="section-title" id="view-heading">View</h2>
        <div class="button-row view-row">
          <button id="zoom-in-btn" class="btn-secondary">Zoom In</button>
          <button id="zoom-out-btn" class="btn-secondary">Zoom Out</button>
          <button id="reset-view-btn" class="btn-secondary">Reset View</button>
        </div>
        <p class="control-hint">Scroll or pinch to zoom; drag to move around.</p>
      </section>
    </aside>

    <section class="canvas-wrap">
      <canvas id="fractal-canvas" width="980" height="680" aria-label="Fractal canvas"></canvas>
      <button id="toggle-controls-btn" class="toggle-controls-btn" type="button">Hide Controls</button>
      <div id="status" class="status" role="status" aria-live="polite">Ready</div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
