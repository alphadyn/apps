<!DOCTYPE html>
<html lang="en">
  <head>
    <script defer src="/apps/analytics.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pencil Sketch</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Image Effects</p>
          <h1>Pencil Sketch</h1>
        </div>
      </header>

      <main class="app-card">
        <section class="controls">
          <label class="file-picker" id="dropZone" for="fileInput">
            <span>Choose an image</span>
            <small>or drag &amp; drop here</small>
            <input id="fileInput" type="file" accept="image/*" />
          </label>

          <label class="selector" for="modeSelect">
            <span>Sketch style</span>
            <select id="modeSelect">
              <option value="bw">Black &amp; White</option>
              <option value="color">Color Pencil</option>
            </select>
          </label>

          <label class="slider-group" for="detailRange">
            <span>Line detail</span>
            <div class="slider-row">
              <input id="detailRange" type="range" min="0" max="100" step="1" value="65" aria-describedby="detailHint" />
              <output id="detailValue" for="detailRange">65%</output>
            </div>
            <small id="detailHint">Loose outlines to fine pencil lines</small>
          </label>

          <label class="slider-group" for="pressureRange">
            <span>Pencil pressure</span>
            <div class="slider-row">
              <input id="pressureRange" type="range" min="0" max="100" step="1" value="55" aria-describedby="pressureHint" />
              <output id="pressureValue" for="pressureRange">55%</output>
            </div>
            <small id="pressureHint">Light graphite to bold, dark strokes</small>
          </label>

          <label class="slider-group" for="textureRange">
            <span>Shading texture</span>
            <div class="slider-row">
              <input id="textureRange" type="range" min="0" max="100" step="1" value="50" aria-describedby="textureHint" />
              <output id="textureValue" for="textureRange">50%</output>
            </div>
            <small id="textureHint">Smooth shading to textured pencil hatching</small>
          </label>

          <div class="button-row">
            <button id="generateBtn" type="button">Generate Sketch</button>
            <button id="downloadBtn" class="secondary" type="button">Download PNG</button>
          </div>

          <p id="status" class="status">Upload an image to begin.</p>
          <a id="openImageLink" class="open-image-link" target="_blank" rel="noopener" hidden>Open sketch image to save</a>
        </section>

        <div class="preview-toggle" role="group" aria-label="Preview image">
          <button id="showOriginalBtn" class="secondary" type="button" aria-pressed="true">Original</button>
          <button id="showSketchBtn" class="secondary" type="button" aria-pressed="false">Sketch</button>
        </div>

        <section class="preview-grid">
          <figure id="originalPanel" class="panel">
            <figcaption>Original</figcaption>
            <canvas id="originalCanvas" width="640" height="480"></canvas>
          </figure>

          <figure id="sketchPanel" class="panel" hidden>
            <figcaption>Sketch</figcaption>
            <canvas id="sketchCanvas" width="640" height="480" draggable="true"></canvas>
            <span class="drag-hint">Drag to save</span>
          </figure>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
