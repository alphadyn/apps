<!DOCTYPE html>
<html lang="en">
<head>
  <script defer src="/apps/analytics.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Explore ten rotating photographs in a fullscreen gallery with controls on demand." />
  <title>Photo Gallery</title>
  <link rel="canonical" href="https://alphadyn.github.io/apps/photo-gallery/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Photo Gallery" />
  <meta property="og:url" content="https://alphadyn.github.io/apps/photo-gallery/" />
  <meta property="og:title" content="Photo Gallery" />
  <meta property="og:description" content="Explore ten rotating photographs in a fullscreen gallery with controls on demand." />
  <meta property="og:image" content="https://alphadyn.github.io/apps/photo-gallery/social-preview.png" />
  <meta property="og:image:secure_url" content="https://alphadyn.github.io/apps/photo-gallery/social-preview.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="A pastel sunset over a turquoise beach, featured in Photo Gallery." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Photo Gallery" />
  <meta name="twitter:description" content="Explore ten rotating photographs in a fullscreen gallery with controls on demand." />
  <meta name="twitter:image" content="https://alphadyn.github.io/apps/photo-gallery/social-preview.png" />
  <meta name="twitter:image:alt" content="A pastel sunset over a turquoise beach, featured in Photo Gallery." />
  <link rel="stylesheet" href="styles.css" />
  <script defer src="app.js"></script>
</head>
<body>
  <main>
    <section class="gallery" id="carousel" aria-roledescription="carousel" aria-label="Photo gallery"
      aria-describedby="gallery-instructions" tabindex="0">
      <p id="gallery-instructions" hidden>
        Tap, click, or press Enter to show or hide controls. Double-tap to play or pause.
        Use the arrow keys or swipe left or right to change photos.
      </p>
      <div class="carousel-track" id="carousel-track"></div>
      <div class="carousel-overlay" id="gallery-controls" hidden>
        <div class="control-row">
          <span class="caption" id="caption"></span>
          <div class="transport" role="group" aria-label="Slideshow controls">
            <button class="control-btn" id="prev-btn" type="button" aria-label="Previous photo">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path class="icon-line" d="m15 6-6 6 6 6"/></svg>
            </button>
            <button class="control-btn play-btn" id="play-btn" type="button" aria-label="Pause rotation">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path id="pause-icon" class="icon-line" d="M9 6v12m6-12v12"/>
                <path id="play-icon" fill="currentColor" d="m9 5 11 7-11 7z" hidden/>
              </svg>
            </button>
            <button class="control-btn" id="next-btn" type="button" aria-label="Next photo">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path class="icon-line" d="m9 6 6 6-6 6"/></svg>
            </button>
          </div>
        </div>
        <nav class="thumbnails" id="thumbnails" aria-label="Photo thumbnails"></nav>
      </div>
    </section>
  </main>
</body>
</html>
